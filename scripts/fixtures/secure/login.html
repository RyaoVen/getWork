<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>登录</title></head>
<body>
  <h1>测试公司 登录</h1>
  <form id="login-form">
    <input id="username" name="username" placeholder="账号">
    <input id="password" name="password" type="password" placeholder="密码">
    <button id="login-btn">登录</button>
  </form>
  <div id="login-error" style="display:none;color:red">账号或密码错误</div>
  <script>
    document.getElementById('login-btn').addEventListener('click', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;
      if (u === 'demo' && p === 'secret') {
        document.cookie = 'session=ok; path=/';
        location.href = '/secure/jobs.html';
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
