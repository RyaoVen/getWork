# 校招/实习岗位来源配置。三种 strategy：
#   platform —— 公司校招走统一招聘平台，后端是 JSON API，直接请求（api.*）。
#   static   —— 普通 HTML 页面，用 CSS 选择器抓取列表。
#   dynamic  —— JS 重页面（SPA），用 Playwright 驱动；配 api.* 时监听页面自己发出的
#               岗位 API 响应（response_match 匹配 URL 片段）并解析 JSON，规避签名/anti-bot。
# 需要登录的来源配 needs_login + login.*，由 Agent 用 login 工具处理。
#
# 新增公司：加一个 source 条目即可，选择器/端点全部配置化，不用改代码。
# 运行时通过 add_source 工具追加的公司写进 config/sources.custom.yaml。

settings:
  output_dir: "data/output"
  timeouts_sec:
    request: 20
    page_load: 45
    login: 60
  browser:
    headless: true
    viewport: [1280, 900]

sources:
  # ---- 腾讯（响应已确认：data.positionList / data.count） ----
  - key: tencent
    name: "腾讯校招"
    url: "https://join.qq.com/post.html?query=p_104"
    strategy: dynamic
    api:
      response_match: "searchPosition"
      data_path: "data.positionList"
      total_path: "data.count"
      load_more_selector: ".btn-next"
      load_more_rounds: 8
    fields:
      title: "positionTitle"
      location: "workCities"
      job_type: "recruitLabelName"
      apply_url: "positionUrl"
    # 详情接口：jobDetails/getJobDetailsByPostId（页面会话内可直接调）
    detail:
      url: "https://join.qq.com/api/v1/jobDetails/getJobDetailsByPostId?postId={postId}"
      method: GET
      data_path: "data"
      throttle: 0.2
      fields:
        description: "desc"
        requirement: "request"

  # ---- 京东（响应已确认：body.items） ----
  - key: jd
    name: "京东校招"
    url: "https://campus.jd.com/#/jobs?selProjects=45"
    strategy: dynamic
    api:
      response_match: "position/page"
      data_path: "body.items"
      total_path: "body.total"
      load_more_selector: ".ant-pagination-next"
      load_more_rounds: 8
    fields:
      title: "positionName"
      location: "workCity"
      job_type: "jobDirection"
      publish_date: "publishTime"
    # 列表 API 不含要求，逐岗位调详情接口补全（详情接口在页面会话内可直接调）
    detail:
      url: "https://campus.jd.com/api/wx/position/detail/{publishId}"
      method: POST
      body: { id: "{publishId}" }
      data_path: "body"
      throttle: 0.2
      fields:
        description: "workContent"
        requirement: "qualification"
        location: "requirementVoList.workCity"

  # ---- 字节跳动（响应已确认：data.job_post_list） ----
  - key: bytedance
    name: "字节跳动校招"
    url: "https://jobs.bytedance.com/campus/position?keywords=&category=&location=&project=7194661644654577981%2C7194661126919358757&type=&job_hot_flag=&current=1&limit=10&functionCategory=&tag="
    strategy: dynamic
    api:
      response_match: "search/job/posts"
      data_path: "data.job_post_list"
      total_path: "data.total"
      load_more_selector: ".atsx-pagination-next"
      load_more_rounds: 8
    fields:
      title: "title"
      location: "city_info"
      job_type: "recruit_type"
      publish_date: "publish_time"
      description: "description"
      requirement: "requirement"
      apply_url: "https://jobs.bytedance.com/campus/position/detail/{id}"

  # ---- 阿里巴巴（响应已确认：content.datas） ----
  - key: alibaba
    name: "阿里巴巴校招"
    url: "https://campus-talent.alibaba.com/campus/position?batchId=100000560002"
    strategy: dynamic
    api:
      response_match: "position/search"
      data_path: "content.datas"
      total_path: "content.total"
      load_more_selector: ".next-pagination-item.next-next"
      load_more_rounds: 8
    fields:
      title: "name"
      location: "workLocations"
      publish_date: "modifyTime"
    # 详情接口带 csrf（用当前 XSRF-TOKEN cookie 填充 {csrf}）
    detail:
      mode: page
      url: "https://campus-talent.alibaba.com/campus/position/{id}"
      text_markers:
        description: ["职位描述"]
        requirement: ["职位要求", "任职要求"]
      throttle: 0.3

  # ---- 得物（响应已确认：data.job_post_list，与字节同平台） ----
  - key: dewu
    name: "得物校招"
    url: "https://campus.dewu.com/578078/position/list?keywords=&category=&location=&project=7623619302324226314%2C7309753987297167679&type=&job_hot_flag=&current=1&limit=10&functionCategory=&tag="
    strategy: dynamic
    api:
      response_match: "search/job/posts"
      data_path: "data.job_post_list"
      total_path: "data.total"
      load_more_selector: ".atsx-pagination-next"
      load_more_rounds: 8
    fields:
      title: "title"
      location: "city_info"
      job_type: "recruit_type"
      publish_date: "publish_time"
      description: "description"
      requirement: "requirement"
      apply_url: "https://campus.dewu.com/578078/position/detail/{id}"

  # ---- 超聚变（响应已确认：data.result） ----
  - key: xfusion
    name: "超聚变校招"
    url: "https://career.xfusion.com/OfficialPortal/#/traineeList"
    strategy: dynamic
    api:
      response_match: "osPostpagelist"
      data_path: "data.result"
      total_path: "data.total"
      load_more_selector: ".btn-next"
      load_more_rounds: 8
    fields:
      title: "postName"
    # 详情接口需 X-HW-ID（固定值在 URL 里）；职责/要求在各发布渠道块里
    detail:
      url: "https://apig.xfusion.com/api/xJob/xjobpostdeliver/postDeliverDetail?postId={postIdKey}&pubChannel=3&X-HW-ID=aa7ff6cd1d724291a2bf569e7dd29fb0"
      method: GET
      data_path: "data"
      throttle: 0.2
      fields:
        description: "postPubChannList.jobDesc"
        requirement: "postPubChannList.jobRequirement"

  # ---- 拼多多（部分：捕获到的是实习项目列表 result.list，岗位细分待补） ----
  - key: pdd
    name: "拼多多校招"
    url: "https://careers.pddglobalhr.com/campus/intern"
    strategy: dynamic
    api:
      response_match: "position/train/list"
      data_path: "result.list"
      total_path: "result.total"
    fields:
      title: "name"
      location: "workLocationName"
      job_type: "recruitTypeName"
      publish_date: "releaseTime"
      description: "jobDuty"

  # ---- 贝壳（GetJobAdPageList 响应已确认） ----
  - key: beike
    name: "贝壳校招"
    url: "https://campus.ke.com/intern/jobs"
    strategy: dynamic
    api:
      response_match: "GetJobAdPageList"
      data_path: "Data"
    fields:
      title: "JobAdName"
      job_type: "Category"
      apply_url: "https://campus.ke.com/intern/jobs"

  # ---- 腾讯音乐（uc-job/list 响应已确认） ----
  - key: tencentmusic
    name: "腾讯音乐校招"
    url: "https://join.tencentmusic.com/campus/post?type=30"
    strategy: dynamic
    api:
      response_match: "uc-job/list"
      data_path: "data.items"
    fields:
      title: "name"
      description: "duty"
      job_type: "jobf_descr"
      location: "work_city"

  # ---- 小红书（pageQueryPosition 响应已确认，含要求） ----
  - key: xiaohongshu
    name: "小红书校招"
    url: "http://job.xiaohongshu.com/campus/position?campusRecruitTypes=term_intern"
    strategy: dynamic
    api:
      response_match: "pageQueryPosition"
      data_path: "data.list"
    fields:
      title: "positionName"
      location: "workplace"
      job_type: "jobType"
      publish_date: "publishTime"
      description: "duty"
      requirement: "qualification"

  # ---- 快手（positions/simple 响应已确认） ----
  - key: kuaishou
    name: "快手校招"
    url: "https://zhaopin.kuaishou.cn/recruit/e/#/official/trainee/?workLocationCode=domestic"
    strategy: dynamic
    api:
      response_match: "positions/simple"
      data_path: "result.list"
    fields:
      title: "name"

  # ---- 网易（queryPage 响应已确认，含要求/描述） ----
  - key: netease
    name: "网易校招"
    url: "https://hr.163.com/job-list.html?workType=1"
    strategy: dynamic
    api:
      response_match: "queryPage"
      data_path: "data.list"
    fields:
      title: "name"
      job_type: "firstPostTypeName"
      description: "description"
      requirement: "requirement"
      department: "firstDepName"

  # ---- 以下站点岗位 API 结构尚未完全逆向，先注册，待补充 response_match/fields ----
  # ---- 美团（getJobList 直调，纯 httpx 可通，列表含职责/要求） ----
  - key: meituan
    name: "美团校招"
    url: "https://zhaopin.meituan.com/web/campus"
    strategy: platform
    api:
      url: "https://zhaopin.meituan.com/api/official/job/getJobList"
      method: POST
      body:
        page: { pageNo: 1, pageSize: 10 }
        jobShareType: "1"
        keywords: ""
        cityList: []
        department: []
        jfJgList: []
        jobType: [ { code: "1", subCode: [] }, { code: "2", subCode: [] } ]
        typeCode: []
        specialCode: []
      page_param: "pageNo"
      page_size: 10
      page_size_key: "page.pageSize"
      body_page_key: "page.pageNo"
      data_path: "data.list"
      total_path: "data.page.totalCount"
    fields:
      title: "name"
      location: "cityList.name"
      department: "department.name"
      job_type: "jobFamily"
      publish_date: "refreshTime"
      description: "jobDuty"
      requirement: "jobRequirement"
      apply_url: "https://zhaopin.meituan.com/web/position/detail?jobUnionId={jobUnionId}&highlightType=campus"

  # ---- 滴滴（Moka jobs/v2 需解密：AES-128-CBC, key=necromancer） ----
  - key: didi
    name: "滴滴校招"
    url: "https://app.mokahr.com/apply/didiglobal/6222#/jobs?zhineng%5B0%5D=48460"
    strategy: platform
    platform: moka
    api:
      url: "https://app.mokahr.com/api/outer/ats-apply/website/jobs/v2"
      method: POST
      headers:
        referer: "https://app.mokahr.com/apply/didiglobal/6222"
      body:
        orgId: "didiglobal"
        siteId: 6222
        limit: 30
        offset: 0
        needStat: true
        jobIdTopList: []
        zhinengIds: [48460]
        customFields: {}
        site: "social"
        locale: "zh-CN"
      page_param: "offset"
      page_size: 30
      page_size_key: "limit"
      body_page_key: "offset"
      offset_mode: true
      decrypt: "moka"
      data_path: "data.jobs"
      total_path: "data.jobStats.total"
    fields:
      title: "title"
      location: "locations.cityName"
      job_type: "zhineng.name"
      publish_date: "publishedAt"
      apply_url: "https://app.mokahr.com/apply/didiglobal/6222"

  # ---- 唯品会（Moka jobs/v2 需解密） ----
  - key: vipshop
    name: "唯品会校招"
    url: "https://app-tc.mokahr.com/campus-recruitment/vipshophr/8015?sourceToken=d7b00ea2471aaddd55b3f402bb4fcc19#/jobs"
    strategy: platform
    platform: moka
    api:
      url: "https://app-tc.mokahr.com/api/outer/ats-apply/website/jobs/v2"
      method: POST
      headers:
        referer: "https://app-tc.mokahr.com/campus-recruitment/vipshophr/8015"
      body:
        orgId: "vipshophr"
        siteId: 8015
        limit: 30
        offset: 0
        needStat: true
        jobIdTopList: []
        zhinengIds: []
        customFields: {}
        site: "social"
        locale: "zh-CN"
      page_param: "offset"
      page_size: 30
      page_size_key: "limit"
      body_page_key: "offset"
      offset_mode: true
      decrypt: "moka"
      data_path: "data.jobs"
      total_path: "data.jobStats.total"
    fields:
      title: "title"
      location: "locations.cityName"
      job_type: "zhineng.name"
      publish_date: "publishedAt"
      apply_url: "https://app-tc.mokahr.com/campus-recruitment/vipshophr/8015"

  - key: tongcheng
    name: "同程校招"
    url: "https://mhr.ly.com/recruit/schoolPortal/#/postDelivery?srt=0.4871249267327028"
    strategy: dynamic
    api:
      response_match: "schoolJob"
      data_path: "data.list"
    fields:
      title: "positionName"
      location: "workCity"

  # ---- 携程（getJobAd category=1 直调，含职责/要求） ----
  - key: ctrip
    name: "携程校招"
    url: "https://job.ctrip.com/#/campus/jobList"
    strategy: platform
    api:
      url: "https://job.ctrip.com/api/hrrecruit/getJobAd"
      method: POST
      headers:
        referer: "https://job.ctrip.com/#/campus/jobList"
      body:
        condition:
          fromId: []
          keyword: ""
          kind: []
          country: []
          city: []
          bucode: []
          jobFamilyCode: []
          jobFamilyGroupCode: []
          category: 1
        pager: { index: "1", size: "100" }
        head: { language: "zh_CN", version: "1" }
      page_param: "index"
      page_size: 100
      page_size_key: "pager.size"
      body_page_key: "pager.index"
      data_path: "retValue.recruitJobAdList"
      total_path: "retValue.total"
    fields:
      title: "jobTitle"
      location: "cityName"
      description: "duty"
      requirement: "requirements"
      publish_date: "publishDate"
      job_type: "jobFamilyGroupName"

  # ---- 百度（getPostListNew 表单直调，含要求/描述） ----
  - key: baidu
    name: "百度校招"
    url: "https://talent.baidu.com/jobs/list?recruitType=INTERN"
    strategy: platform
    api:
      url: "https://talent.baidu.com/httservice/getPostListNew"
      method: POST
      form: true
      headers:
        referer: "https://talent.baidu.com/jobs/list?recruitType=INTERN"
      body:
        recruitType: "INTERN"
        pageSize: 20
        keyWord: ""
        curPage: 1
        projectType: ""
      page_param: "curPage"
      page_size: 20
      page_size_key: "pageSize"
      body_page_key: "curPage"
      data_path: "data.list"
      total_path: "data.total"
    fields:
      title: "name"
      location: "workPlace"
      description: "workContent"
      requirement: "serviceCondition"
      publish_date: "publishDate"
      job_type: "postType"
