# 校招/实习岗位来源配置。三种 strategy：
#   platform —— 公司校招走统一招聘平台，后端是 JSON API，直接请求（api.*）。
#   static   —— 普通 HTML 页面，用 CSS 选择器抓取列表。
#   dynamic  —— JS 重页面（SPA），用 Playwright 驱动；配 api.* 时监听页面自己发出的
#               岗位 API 响应（response_match 匹配 URL 片段）并解析 JSON，规避签名/anti-bot。
# 需要登录的来源配 needs_login + login.*，由 Agent 用 login 工具处理。
#
# 新增公司：加一个 source 条目即可，选择器/端点全部配置化，不用改代码。
# 运行时通过 add_source 工具追加的公司写进 config/sources.custom.yaml。

settings:
  output_dir: "data/output"
  timeouts_sec:
    request: 20
    page_load: 45
    login: 60
  browser:
    headless: true
    viewport: [1280, 900]

sources:
  # ---- 腾讯（响应已确认：data.positionList / data.count） ----
  - key: tencent
    name: "腾讯校招"
    url: "https://join.qq.com/post.html?query=p_104"
    strategy: dynamic
    api:
      response_match: "searchPosition"
      data_path: "data.positionList"
      total_path: "data.count"
      load_more_selector: ".btn-next"
      load_more_rounds: 8
    fields:
      title: "positionTitle"
      location: "workCities"
      job_type: "recruitLabelName"
      apply_url: "positionUrl"
    # 详情接口：jobDetails/getJobDetailsByPostId（页面会话内可直接调）
    detail:
      url: "https://join.qq.com/api/v1/jobDetails/getJobDetailsByPostId?postId={postId}"
      method: GET
      data_path: "data"
      throttle: 0.2
      fields:
        description: "desc"
        requirement: "request"

  # ---- 京东（响应已确认：body.items） ----
  - key: jd
    name: "京东校招"
    url: "https://campus.jd.com/#/jobs?selProjects=45"
    strategy: dynamic
    api:
      response_match: "position/page"
      data_path: "body.items"
      total_path: "body.total"
      load_more_selector: ".ant-pagination-next"
      load_more_rounds: 8
    fields:
      title: "positionName"
      location: "workCity"
      job_type: "jobDirection"
      publish_date: "publishTime"
    # 列表 API 不含要求，逐岗位调详情接口补全（详情接口在页面会话内可直接调）
    detail:
      url: "https://campus.jd.com/api/wx/position/detail/{publishId}"
      method: POST
      body: { id: "{publishId}" }
      data_path: "body"
      throttle: 0.2
      fields:
        description: "workContent"
        requirement: "qualification"
        location: "requirementVoList.workCity"

  # ---- 字节跳动（响应已确认：data.job_post_list） ----
  - key: bytedance
    name: "字节跳动校招"
    url: "https://jobs.bytedance.com/campus/position?keywords=&category=&location=&project=7194661644654577981%2C7194661126919358757&type=&job_hot_flag=&current=1&limit=10&functionCategory=&tag="
    strategy: dynamic
    api:
      response_match: "search/job/posts"
      data_path: "data.job_post_list"
      total_path: "data.total"
      load_more_selector: ".atsx-pagination-next"
      load_more_rounds: 8
    fields:
      title: "title"
      location: "city_info"
      job_type: "recruit_type"
      publish_date: "publish_time"
      description: "description"
      requirement: "requirement"
      apply_url: "https://jobs.bytedance.com/campus/position/detail/{id}"

  # ---- 阿里巴巴（响应已确认：content.datas） ----
  - key: alibaba
    name: "阿里巴巴校招"
    url: "https://campus-talent.alibaba.com/campus/position?batchId=100000560002"
    strategy: dynamic
    api:
      response_match: "position/search"
      data_path: "content.datas"
      total_path: "content.total"
      load_more_selector: ".next-pagination-item.next-next"
      load_more_rounds: 8
    fields:
      title: "name"
      location: "workLocations"
      publish_date: "modifyTime"
    # 详情接口带 csrf（用当前 XSRF-TOKEN cookie 填充 {csrf}）
    detail:
      mode: page
      url: "https://campus-talent.alibaba.com/campus/position/{id}"
      text_markers:
        description: ["职位描述"]
        requirement: ["职位要求", "任职要求"]
      throttle: 0.3

  # ---- 得物（响应已确认：data.job_post_list，与字节同平台） ----
  - key: dewu
    name: "得物校招"
    url: "https://campus.dewu.com/578078/position/list?keywords=&category=&location=&project=7623619302324226314%2C7309753987297167679&type=&job_hot_flag=&current=1&limit=10&functionCategory=&tag="
    strategy: dynamic
    api:
      response_match: "search/job/posts"
      data_path: "data.job_post_list"
      total_path: "data.total"
      load_more_selector: ".atsx-pagination-next"
      load_more_rounds: 8
    fields:
      title: "title"
      location: "city_info"
      job_type: "recruit_type"
      publish_date: "publish_time"
      description: "description"
      requirement: "requirement"
      apply_url: "https://campus.dewu.com/578078/position/detail/{id}"

  # ---- 超聚变（响应已确认：data.result） ----
  - key: xfusion
    name: "超聚变校招"
    url: "https://career.xfusion.com/OfficialPortal/#/traineeList"
    strategy: dynamic
    api:
      response_match: "osPostpagelist"
      data_path: "data.result"
      total_path: "data.total"
      load_more_selector: ".btn-next"
      load_more_rounds: 8
    fields:
      title: "postName"
    # 详情接口需 X-HW-ID（固定值在 URL 里）；职责/要求在各发布渠道块里
    detail:
      url: "https://apig.xfusion.com/api/xJob/xjobpostdeliver/postDeliverDetail?postId={postIdKey}&pubChannel=3&X-HW-ID=aa7ff6cd1d724291a2bf569e7dd29fb0"
      method: GET
      data_path: "data"
      throttle: 0.2
      fields:
        description: "postPubChannList.jobDesc"
        requirement: "postPubChannList.jobRequirement"

  # ---- 拼多多（部分：捕获到的是实习项目列表 result.list，岗位细分待补） ----
  - key: pdd
    name: "拼多多校招"
    url: "https://careers.pddglobalhr.com/campus/intern"
    strategy: dynamic
    api:
      response_match: "position/train/list"
      data_path: "result.list"
      total_path: "result.total"
    fields:
      title: "name"
      location: "workLocationName"
      job_type: "recruitTypeName"
      publish_date: "releaseTime"
      description: "jobDuty"

  # ---- 以下三家岗位 API 结构尚未完全逆向，先注册，待补充 response_match/fields ----
  - key: meituan
    name: "美团校招"
    url: "https://zhaopin.meituan.com/web/campus"
    strategy: dynamic
    api:
      response_match: "recruit"
      data_path: "data.list"
    fields:
      title: "title"
      location: "location"

  - key: tongcheng
    name: "同程校招"
    url: "https://mhr.ly.com/recruit/schoolPortal/#/postDelivery?srt=0.4871249267327028"
    strategy: dynamic
    api:
      response_match: "schoolJob"
      data_path: "data.list"
    fields:
      title: "positionName"
      location: "workCity"

  - key: ctrip
    name: "携程校招"
    url: "https://job.ctrip.com/#/campus/jobList"
    strategy: dynamic
    api:
      response_match: "getJobAd"
      data_path: "data.list"
    fields:
      title: "title"
      location: "city"
