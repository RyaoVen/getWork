[project]
name = "getwork"
version = "0.1.0"
description = "MCP server for crawling campus-recruitment job postings, generating briefings, and emailing them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "markdown>=3.10.3",
    "mcp[cli]>=2.0.0",
    "playwright>=1.62.0",
    "pycryptodome>=3.23.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]
